<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>稼働条件</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #6b7684;
    --line: #e4e8ee;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --accent: #2f6f6a;
    --accent-soft: #e6f0ef;
  }
  * , *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--ink);
    background: var(--bg);
    padding: 16px 12px calc(16px + env(safe-area-inset-bottom));
  }
  .card {
    max-width: 560px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .head { padding: 20px 18px 4px; }
  .head h1 { font-size: 18px; margin: 0 0 4px; }
  .head p { margin: 0; color: var(--muted); font-size: 13px; }
  .block { padding: 16px 18px; border-top: 1px solid var(--line); }
  .block.first { border-top: none; }
  .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
  .hidden { display: none !important; }

  .timepair { display: flex; align-items: center; gap: 10px; }
  .tilde { color: var(--muted); }
  input[type="time"], input[type="number"] {
    font: inherit; padding: 9px 9px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); width: 108px;
  }
  input[type="number"] { width: 64px; text-align: right; }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .seg { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; }
  .seg button {
    flex: 1; font: inherit; font-size: 14px; padding: 11px 8px; border: none; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .daypills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .pill {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
  }
  .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .uniform-config { border-top: 1px dashed var(--line); padding-top: 14px; }

  .typetoggle { display: inline-flex; gap: 4px; margin-bottom: 12px; background: var(--bg); padding: 3px; border-radius: 8px; }
  .typetoggle button {
    font: inherit; font-size: 13px; padding: 8px 14px; border: none; border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .typetoggle button.on { background: #fff; color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  .inputs { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .inputs label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .inputs .winline { flex-basis: 100%; }
  .inputs .winline input[type="time"] { width: 100px; }

  .perday { padding: 8px 18px 16px; }
  .dayrow { display: flex; align-items: flex-start; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .dayrow:last-child { border-bottom: none; }
  .daytoggle {
    flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
  }
  .daytoggle.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .dayconfig { flex: 1; min-width: 0; }
  .restlabel { align-self: center; color: #aab2bd; font-size: 13px; }

  .summary { padding: 18px; border-top: 1px solid var(--line); background: var(--accent-soft); }
  .sum-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .sum-row span { color: var(--muted); font-size: 13px; }
  .sum-row strong { font-size: 16px; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px;
    background: #fff; border: 1px solid var(--line); font-size: 12px;
  }
  .chip em { font-style: normal; color: var(--accent); font-weight: 600; }
  .chip.off { color: #aab2bd; background: transparent; }
</style>
</head>
<body>
<div class="card">
  <header class="head">
    <h1>稼働条件</h1>
    <p>依頼ごとの勤務パターンを設定します。</p>
  </header>

  <section class="block first">
    <div class="seg">
      <button data-mode="uniform" class="on">一律で指定</button>
      <button data-mode="perDay">曜日ごとに指定</button>
    </div>
  </section>

  <section class="block" id="uniformEditor"></section>
  <section class="block perday hidden" id="perDayEditor"></section>

  <footer class="summary">
    <div class="sum-row"><span>稼働日数</span><strong id="sumDays">週 0 日</strong></div>
    <div class="sum-row"><span>週合計 実働</span><strong id="sumHours">0 h</strong></div>
    <div class="chips" id="chips"></div>
  </footer>
</div>

<script>
const DAYS = [
  { key:"mon", label:"月" }, { key:"tue", label:"火" }, { key:"wed", label:"水" },
  { key:"thu", label:"木" }, { key:"fri", label:"金" }, { key:"sat", label:"土" }, { key:"sun", label:"日" },
];

let mode = "uniform";
let winRange = { start:"08:00", end:"20:00" };
let uniform = {
  days: { mon:true, tue:true, wed:true, thu:true, fri:true, sat:false, sun:false },
  type:"flexible", work:8, break:60, start:"09:00", end:"18:00",
};
let perDay = {};
DAYS.forEach(d => perDay[d.key] = { on:false, type:"flexible", work:8, break:60, start:"09:00", end:"18:00" });

const timeToMin = t => { if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
function workHours(d){
  if(!d || !d.on) return null;
  if(d.type==="fixed"){
    const s=timeToMin(d.start), e=timeToMin(d.end);
    if(s==null||e==null||e<=s) return null;
    const h=(e-s-(Number(d.break)||0))/60; return h>0?h:null;
  }
  const h=Number(d.work); return h>0?h:null;
}
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);

function dayConfigHTML(d, prefix){
  const flex = d.type==="flexible";
  return `
    <div class="typetoggle">
      <button data-act="type" data-val="flexible" class="${flex?'on':''}">時間帯内</button>
      <button data-act="type" data-val="fixed" class="${!flex?'on':''}">時刻固定</button>
    </div>
    <div class="inputs">
      ${flex ? `
        <label class="winline">営業
          <input type="time" data-act="winStart" value="${winRange.start}">
          <span class="tilde">〜</span>
          <input type="time" data-act="winEnd" value="${winRange.end}">
        </label>
        <label>実働 <input type="number" min="0" step="0.5" data-act="work" value="${d.work}"> h</label>
        <label>休憩 <input type="number" min="0" step="5" data-act="break" value="${d.break}"> 分</label>
      ` : `
        <label><input type="time" data-act="start" value="${d.start}"></label>
        <span class="tilde">〜</span>
        <label><input type="time" data-act="end" value="${d.end}"></label>
        <label>休憩 <input type="number" min="0" step="5" data-act="break" value="${d.break}"> 分</label>
      `}
    </div>`;
}

function renderUniform(){
  const el = document.getElementById("uniformEditor");
  el.innerHTML = `
    <label class="field-label">稼働する曜日</label>
    <div class="daypills">
      ${DAYS.map(d=>`<button class="pill ${uniform.days[d.key]?'on':''}" data-day="${d.key}">${d.label}</button>`).join("")}
    </div>
    <div class="uniform-config" id="uniConfig">${dayConfigHTML(uniform)}</div>`;

  el.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{
    const k=b.dataset.day; uniform.days[k]=!uniform.days[k]; render();
  });
  bindConfig(el.querySelector("#uniConfig"), uniform);
}

function renderPerDay(){
  const el = document.getElementById("perDayEditor");
  el.innerHTML = DAYS.map(d=>{
    const day = perDay[d.key];
    return `<div class="dayrow ${day.on?'on':''}">
      <button class="daytoggle ${day.on?'on':''}" data-day="${d.key}">${d.label}</button>
      ${day.on ? `<div class="dayconfig" data-cfg="${d.key}">${dayConfigHTML(day)}</div>`
               : `<span class="restlabel">休み</span>`}
    </div>`;
  }).join("");

  el.querySelectorAll(".daytoggle").forEach(b=>b.onclick=()=>{
    const k=b.dataset.day; perDay[k].on=!perDay[k].on; render();
  });
  el.querySelectorAll("[data-cfg]").forEach(c=>bindConfig(c, perDay[c.dataset.cfg]));
}

function bindConfig(container, obj){
  if(!container) return;
  container.querySelectorAll("[data-act]").forEach(node=>{
    const act = node.dataset.act;
    if(node.tagName==="BUTTON"){
      node.onclick = ()=>{ obj.type = node.dataset.val; render(); };
    } else if(act==="winStart" || act==="winEnd"){
      node.oninput = ()=>{ winRange[act==="winStart"?"start":"end"] = node.value; updateSummary(); };
    } else {
      node.oninput = ()=>{ obj[act] = node.value; updateSummary(); };
    }
  });
}

function computeWeek(){
  return DAYS.map(d=>{
    let hours;
    if(mode==="uniform"){ hours = workHours({ ...uniform, on: uniform.days[d.key] }); }
    else { hours = workHours(perDay[d.key]); }
    return { key:d.key, label:d.label, hours };
  });
}

function updateSummary(){
  const week = computeWeek();
  const total = week.reduce((s,d)=>s+(d.hours||0),0);
  const active = week.filter(d=>d.hours!=null).length;
  document.getElementById("sumDays").textContent = `週 ${active} 日`;
  document.getElementById("sumHours").textContent = `${fmt(total)} h`;
  document.getElementById("chips").innerHTML = week.map(d=>
    `<span class="chip ${d.hours==null?'off':''}">${d.label}${d.hours!=null?`<em>${fmt(d.hours)}h</em>`:''}</span>`
  ).join("");
}

function render(){
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on", b.dataset.mode===mode));
  document.getElementById("uniformEditor").classList.toggle("hidden", mode!=="uniform");
  document.getElementById("perDayEditor").classList.toggle("hidden", mode!=="perDay");
  if(mode==="uniform") renderUniform(); else renderPerDay();
  updateSummary();
}

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; render(); });
render();
</script>
</body>
</html>
